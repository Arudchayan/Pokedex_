query getEncounterLocations($pokemonId: Int!) {
  encounter(
    where: { pokemon_id: { _eq: $pokemonId } }
    order_by: { version: { name: asc }, locationarea: { location: { name: asc } } }
  ) {
    min_level
    max_level
    encounterslot {
      rarity
      encountermethod {
        name
      }
    }
    version {
      name
    }
    locationarea {
      location {
        name
      }
    }
  }
}
