query FetchItems {
  item(
    order_by: { id: asc }
    where: {
      _or: [
        {
          itemattributemaps: {
            itemattribute: { name: { _in: ["holdable", "holdable-passive", "holdable-active"] } }
          }
        }
        { itemcategory: { name: { _eq: "held-items" } } }
      ]
    }
  ) {
    id
    name
    itemprices(limit: 1, order_by: { purchase_price: desc_nulls_last }) {
      purchase_price
    }
    itemflavortexts(where: { language: { name: { _eq: "en" } } }, limit: 1) {
      flavor_text
    }
  }
}
