query FetchItems {
  item(
    limit: 100
    order_by: { id: asc }
    where: { itemattributemaps: { itemattribute: { name: { _eq: "holdable" } } } }
  ) {
    id
    name
    itemprices(limit: 1, order_by: { purchase_price: desc_nulls_last }) {
      purchase_price
    }
    itemflavortexts(where: { language: { name: { _eq: "en" } } }, limit: 1) {
      flavor_text
    }
  }
}
