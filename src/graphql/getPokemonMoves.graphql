query getPokemonMoves($id: Int!) {
  pokemon(where: { id: { _eq: $id } }) {
    id
    pokemonmoves(order_by: { level: asc, move_learn_method_id: asc }) {
      level
      version_group_id
      versiongroup {
        name
      }
      movelearnmethod {
        name
      }
      move {
        name
        power
        accuracy
        pp
        priority
        type {
          name
        }
        movedamageclass {
          name
        }
      }
    }
  }
}
