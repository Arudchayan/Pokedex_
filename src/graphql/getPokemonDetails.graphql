query getPokemonDetails($id: Int!) {
  pokemonspecies(where: { pokemons: { id: { _eq: $id } } }) {
    id
    name
    capture_rate
    base_happiness
    gender_rate
    pokemoncolor {
      name
    }
    pokemonhabitat {
      name
    }
    pokemonspeciesnames(where: { language: { name: { _eq: "en" } } }) {
      genus
    }
    growthrate {
      name
    }
    pokemonshape {
      name
    }
    pokemonegggroups {
      egggroup {
        name
      }
    }
    evolutionchain {
      pokemonspecies(order_by: { order: asc }) {
        id
        name
        evolves_from_species_id
        pokemons(limit: 1, order_by: { id: asc }) {
          pokemonsprites {
            sprites
          }
        }
        pokemonevolutions {
          min_level
          min_happiness
          evolutiontrigger {
            name
          }
          item {
            name
          }
          held_item_id
          move {
            name
          }
          time_of_day
          location {
            name
          }
        }
      }
    }
    pokemonspeciesflavortexts(
      where: { language: { name: { _eq: "en" } } }
      limit: 1
      order_by: { version_id: desc }
    ) {
      flavor_text
    }
    pokemons(order_by: { id: asc }) {
      id
      name
      height
      weight
      is_default
      pokemonsprites {
        sprites
      }
      pokemontypes(order_by: { slot: asc }) {
        type {
          name
        }
      }
      pokemonstats {
        base_stat
        stat {
          name
        }
      }
      pokemonabilities {
        ability {
          name
        }
      }
    }
  }
}
