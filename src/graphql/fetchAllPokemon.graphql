query fetchAllPokemon($limit: Int!) {
  pokemon(order_by: { id: asc }, where: { id: { _lte: $limit } }) {
    id
    name
    pokemontypes(order_by: { slot: asc }) {
      type {
        name
      }
    }
    pokemonspecy {
      pokemonspeciesflavortexts(
        where: { language: { name: { _eq: "en" } } }
        limit: 1
        order_by: { version_id: desc }
      ) {
        flavor_text
      }
    }
    pokemonstats {
      base_stat
      stat {
        name
      }
    }
    pokemonabilities {
      ability {
        name
      }
    }
  }
}
